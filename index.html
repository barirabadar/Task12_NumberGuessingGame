<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-shape shape-one"></div>
    <div class="background-shape shape-two"></div>
    <main class="game-card">
        <div class="top-icon">🎯</div>
        <span class="tag">NUMBER CHALLENGE</span>
        <h1>Guess the <span>Number!</span></h1>
        <p class="subtitle">
            Test your luck and challenge your mind!
            <br>
            I'm thinking of a number between
            <strong>1 and 20.</strong>
        </p>
        <div class="number-display">
            <span>?</span>
        </div>
        <form id="guess-form">
            <label for="guess-input">Enter your guess</label>
            <input
                type="number"
                id="guess-input"
                min="1"
                max="20"
                placeholder="Type a number..."
                required
            >
            <button type="submit" id="check-button">
                Check My Guess <span>→</span>
            </button>
        </form>
        <div id="message" class="message">
            ✨ Ready to play? Make your first guess!
        </div>
        <div class="stats">
            <div class="stat-box">
                <span class="stat-icon">🎮</span>
                <div>
                    <small>ATTEMPTS</small>
                    <h3 id="attempt-count">0</h3>
                </div>
            </div>
            <div class="stat-box">
                <span class="stat-icon">🏆</span>
                <div>
                    <small>NUMBER RANGE</small>
                    <h3>1 - 20</h3>
                </div>
            </div>
        </div>
        <button type="button" id="play-again" class="restart-button">
            ↻ &nbsp; Play Again
        </button>
        <p class="footer-text">Made with 💜 Happy Guessing!</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
